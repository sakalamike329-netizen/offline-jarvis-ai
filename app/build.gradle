plugins {
    id 'com.android.application' version '8.2.0' apply true
    id 'org.jetbrains.kotlin.android' version '1.9.10' apply true
}
android {
    namespace 'com.mike.jarviszm'
    compileSdk 34
    defaultConfig {
        applicationId "com.mike.jarviszm"
        minSdk 24
        targetSdk 34
    }
}
dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
}
